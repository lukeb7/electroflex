[project]
name = "electroflex"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=12.0",
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "pydantic>=2.0",
  "pytest>=7.0"
]

[tool.pytest.ini_options]
testpaths = [
  "electroflex-data/tests",
  "electroflex-train/tests",
  "electroflex-eval/tests",
  "electroflex-api/tests",
  "electroflex-contracts/tests",
  "tests"
]
pythonpath = [
  "electroflex-data/src",
  "electroflex-train/src",
  "electroflex-eval/src",
  "electroflex-api/src",
  "electroflex-contracts/src"
]
